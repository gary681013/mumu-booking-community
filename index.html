<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mumu Booking Community</title><style>body{font-family:system-ui,"Noto Sans TC",sans-serif;background:#fbf7f1;color:#251d1a;margin:0}.wrap{max-width:760px;margin:auto;padding:56px 20px}h1{font-size:clamp(2rem,7vw,4rem);margin:0}.card{margin-top:28px;background:white;border:1px solid #eadfce;border-radius:18px;padding:24px}label{display:grid;gap:8px;margin:16px 0;font-weight:700}input,select,button{padding:12px;border-radius:10px;font:inherit}input,select{border:1px solid #cabcae;background:#fffdfa}button{border:0;background:#2a211e;color:#fff;font-weight:800;width:100%}.note{color:#685c56;line-height:1.65}.notice{display:none;margin-top:16px;padding:12px;background:#ebf8ef;color:#245d3b;border-radius:10px}</style></head><body><main class="wrap"><p> MUMU BOOKING COMMUNITY </p><h1>重視隱私的預約介面範本</h1><p class="note">提供美容、治療、課程與一對一服務使用的公開起點；不含真實客戶、收入或後台資料。</p><form class="card" id="booking"><h2>建立示範預約</h2><label>服務項目<select id="service"><option>深層放鬆｜60 分鐘｜NT$1200</option><option>平衡舒壓｜90 分鐘｜NT$1700</option><option>全身修復｜120 分鐘｜NT$2200</option></select></label><label>日期<input id="date" type="date" required></label><label>時段<input id="time" type="time" value="10:00" required></label><button>確認示範預約</button><p class="note">只有在使用者串接自己的後端後才處理個資；請勿將金鑰或正式客戶資料提交到 Git。</p><output class="notice" id="notice"></output></form></main><script>const d=document.querySelector("#date");d.min=new Date().toISOString().slice(0,10);d.value=d.min;document.querySelector("#booking").addEventListener("submit",e=>{e.preventDefault();const n=document.querySelector("#notice");n.textContent="已建立示範預約："+d.value+" "+document.querySelector("#time").value+"。此範本不會傳送或保存個人資料。";n.style.display="block"})</script></body></html>
